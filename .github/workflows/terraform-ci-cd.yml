name: Hospital System - Infrastructure CI/CD (Multi-Environment)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target AWS Environment to Deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.5.7'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ============================================================================
  # Stage 1: Quality, Security & Syntax Validation
  # ============================================================================
  code-quality-and-security:
    name: Security & Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks Secret Scanner (Direct CLI execution)
      - name: Run Gitleaks Secret Scanner
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source "$GITHUB_WORKSPACE" --verbose --redact --no-git

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. Canonical Format Check across all environments and modules
      - name: Terraform Format Check
        run: terraform fmt -check -recursive ./terraform

  # ============================================================================
  # Stage 2: DEV Environment (Plan & Deploy)
  # ============================================================================
  dev-environment:
    name: DEV Environment (Deploy)
    needs: code-quality-and-security
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/dev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init (Dev S3 Backend)
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply (Auto on Main Push or Manual Apply)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
        run: |
          echo "Deploying Hospital System Dev Infrastructure to AWS..."
          terraform apply -auto-approve tfplan

  # ============================================================================
  # Stage 3: PROD Environment (Plan on PR / Manual Apply via Dispatch)
  # ============================================================================
  prod-environment:
    name: PROD Environment (Deploy / Validate)
    needs: code-quality-and-security
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/prod

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init (Prod S3 Backend)
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply (Manual Trigger Only for Production Safety)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply'
        run: |
          echo "Deploying Hospital System Production Infrastructure to AWS..."
          terraform apply -auto-approve tfplan
