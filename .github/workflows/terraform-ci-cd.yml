name: Hospital System - Infrastructure CI/CD (Dev Deployment)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (plan or apply)'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.5.7'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ============================================================================
  # Stage 1: Quality, Security & Syntax Validation
  # ============================================================================
  code-quality-and-security:
    name: Security & Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks Secret Scanner
      - name: Run Gitleaks Secret Scanner
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source "$GITHUB_WORKSPACE" --verbose --redact --no-git

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. Canonical Format Check across all environments and modules
      - name: Terraform Format Check
        run: terraform fmt -check -recursive ./terraform

  # ============================================================================
  # Stage 2: Pull Request Validation (Plan Preview)
  # ============================================================================
  pr-plan-preview:
    name: PR Plan Preview (Dev & Prod)
    needs: code-quality-and-security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Dev Plan Preview
        run: |
          cd terraform/environments/dev
          terraform init
          terraform validate
          terraform plan -no-color

      - name: Prod Plan Preview
        run: |
          cd terraform/environments/prod
          terraform init
          terraform validate
          terraform plan -no-color

  # ============================================================================
  # Stage 3: Automated Deploy to DEV Environment
  # ============================================================================
  deploy-dev:
    name: Deploy to DEV Environment
    needs: code-quality-and-security
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: development
    defaults:
      run:
        working-directory: ./terraform/environments/dev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init (Dev S3 Backend)
        run: terraform init

      - name: Terraform Plan (Dev)
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply (Dev)
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          echo "Applying verified Terraform plan to Dev AWS Environment..."
          terraform apply -auto-approve tfplan
