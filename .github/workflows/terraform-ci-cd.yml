name: Hospital System - Infrastructure CI/CD (Terraform on AWS)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.5.7'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ============================================================================
  # Stage 1: Validation, Formatting & Security Checks
  # ============================================================================
  validate-and-plan:
    name: Validate & Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks Secret Scanner
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. Check Canonical Formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 4. Authenticate to AWS via Keyless GitHub OIDC
      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 5. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 6. Validate Syntax and Configuration
      - name: Terraform Validate
        run: terraform validate

      # 7. Terraform Plan
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
        continue-on-error: false

      # 8. Post Plan Summary to Pull Request
      - name: Post Plan to Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### 🏥 Hospital System Infrastructure Plan Status
            * **Pushed by:** @${{ github.actor }}
            * **Action:** \`${{ github.event_name }}\`
            * **Status:** \`SUCCESS ✅\`

            *Pushed commit: ${{ github.sha }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # 9. Save Plan Artifact for Apply Stage
      - name: Save Plan Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: hospital_terraform/tfplan
          retention-days: 1
        continue-on-error: true

  # ============================================================================
  # Stage 2: Automated Apply (Runs only on Push to Main or Manual Apply Dispatch)
  # ============================================================================
  apply:
    name: Terraform Apply (Deploy AWS Infrastructure)
    needs: validate-and-plan
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          echo "Applying verified Terraform plan to AWS..."
          terraform apply -auto-approve
